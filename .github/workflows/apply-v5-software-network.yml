name: Apply v5 software and network integration

on:
  push:
    branches:
      - feature/v5-software-network
    paths:
      - '.github/workflows/apply-v5-software-network.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v5-software-network

      - name: Tools Center in MainForm integrieren
        shell: pwsh
        run: |
          $path = 'src/NTBPW.PdfWatcher/MainForm.cs'
          $content = Get-Content $path -Raw
          $content = $content.Replace('RowCount = 10,', 'RowCount = 11,')
          $content = $content.Replace('for (var i = 1; i <= 7; i++)', 'for (var i = 1; i <= 8; i++)')
          $content = $content.Replace('layout.Controls.Add(CreateNavButton("↻  Updates", OpenUpdateDialog), 0, 7);', 'layout.Controls.Add(CreateNavButton("↻  Updates", OpenUpdateDialog), 0, 7);' + [Environment]::NewLine + '        layout.Controls.Add(CreateNavButton("▦  Tools Center", OpenToolsCenter), 0, 8);')
          $content = $content.Replace('layout.Controls.Add(footer, 0, 8);', 'layout.Controls.Add(footer, 0, 9);')
          $content = $content.Replace('layout.Controls.Add(exit, 0, 9);', 'layout.Controls.Add(exit, 0, 10);')
          $content = $content.Replace('    private void ExitApp() => RequestExit?.Invoke(this, EventArgs.Empty);', '    private void OpenToolsCenter()' + [Environment]::NewLine + '    {' + [Environment]::NewLine + '        using var form = new ToolsCenterForm(_appIcon);' + [Environment]::NewLine + '        form.ShowDialog(this);' + [Environment]::NewLine + '    }' + [Environment]::NewLine + [Environment]::NewLine + '    private void ExitApp() => RequestExit?.Invoke(this, EventArgs.Empty);')
          Set-Content $path $content -Encoding utf8

      - name: Änderung committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NTBPW.PdfWatcher/MainForm.cs
          git diff --cached --quiet || git commit -m "feat: Tools Center in Hauptnavigation integrieren"
          git push
