name: Build and release NTB-PW PDF-Watcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Anmeldung bei Azure per OpenID Connect (Code-Signatur)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    # Die Azure-Vertrauensstellung ist an diese Umgebung gebunden (siehe docs/CODE-SIGNING.md).
    environment: release
    env:
      # Signatur ist optional (siehe docs/CODE-SIGNING.md):
      #  - Azure Artifact Signing, wenn die Variable ARTIFACT_SIGNING_ACCOUNT gesetzt ist,
      #  - sonst eigenes Zertifikat, wenn das Secret SIGNING_PFX_BASE64 gesetzt ist,
      #  - sonst unsigniert.
      AZURE_SIGNING: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
      SIGNING_ENABLED: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' || secrets.SIGNING_PFX_BASE64 != '' }}
      # Keine Geheimnisse – werden von tools\sign-file.ps1 gelesen.
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Tests ausführen
        run: dotnet test .\tests\NTBPW.PdfWatcher.Tests\NTBPW.PdfWatcher.Tests.csproj --configuration Release

      - name: Inno Setup installieren
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Anwendung veröffentlichen
        shell: powershell
        run: |
          dotnet publish .\src\NTBPW.PdfWatcher\NTBPW.PdfWatcher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish

      - name: Version prüfen
        shell: powershell
        run: |
          $version = ([xml](Get-Content .\src\NTBPW.PdfWatcher\NTBPW.PdfWatcher.csproj)).Project.PropertyGroup.Version
          if (-not $version) { throw "Version fehlt in der csproj." }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $version) { throw "Tag v$tag passt nicht zur csproj-Version $version." }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bei Azure anmelden
        if: env.AZURE_SIGNING == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Signaturwerkzeug für Azure vorbereiten
        if: env.AZURE_SIGNING == 'true'
        shell: powershell
        run: .\tools\prepare-artifact-signing.ps1

      - name: Anwendung signieren
        if: env.SIGNING_ENABLED == 'true'
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: .\tools\sign-file.ps1 -Files '.\publish\NTB-PW PDF-Watcher.exe' -TrustOnThisMachine

      - name: Setup erstellen (Setup und Deinstallation werden dabei signiert)
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: .\tools\build-installer.ps1 -Version $env:APP_VERSION -Sign:($env:SIGNING_ENABLED -eq 'true')

      - name: Signatur prüfen
        if: env.SIGNING_ENABLED == 'true'
        shell: powershell
        run: |
          foreach ($file in @(Get-Item '.\publish\NTB-PW PDF-Watcher.exe') + @(Get-ChildItem .\dist\NTB-PW-PDF-Watcher-Setup-*.exe)) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid') { throw "$($file.Name): Signatur ungültig ($($sig.Status))." }
            Write-Host "$($file.Name): signiert von $($sig.SignerCertificate.Subject)"
          }

      - name: SHA-256 erzeugen
        shell: powershell
        run: |
          $setup = Get-ChildItem .\dist\NTB-PW-PDF-Watcher-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup-Datei nicht gefunden." }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii "$($setup.FullName).sha256"

      - name: Installation und Upgrade testen
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem .\dist\NTB-PW-PDF-Watcher-Setup-*.exe | Select-Object -First 1
          .\tools\test-installer.ps1 -NewSetup $setup.FullName -ExpectedVersion $env:APP_VERSION -ExpectSigned:($env:SIGNING_ENABLED -eq 'true')

      - name: GitHub Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/NTB-PW-PDF-Watcher-Setup-*.exe
            dist/NTB-PW-PDF-Watcher-Setup-*.exe.sha256
