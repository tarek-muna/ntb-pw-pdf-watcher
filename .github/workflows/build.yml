name: Build NTB-PW PDF-Watcher

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Abhängigkeiten wiederherstellen
        run: dotnet restore .\src\NTBPW.PdfWatcher\NTBPW.PdfWatcher.csproj

      - name: Anwendung kompilieren
        run: dotnet build .\src\NTBPW.PdfWatcher\NTBPW.PdfWatcher.csproj --configuration Release --no-restore

      - name: Tests ausführen
        run: dotnet test .\tests\NTBPW.PdfWatcher.Tests\NTBPW.PdfWatcher.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  installer:
    # Baut das Setup und prueft Neuinstallation, Upgrade von der letzten Version und Programmstart.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Inno Setup installieren
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Anwendung veröffentlichen
        shell: powershell
        run: |
          dotnet publish .\src\NTBPW.PdfWatcher\NTBPW.PdfWatcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wegwerf-Zertifikat erzeugen
        # Prueft den kompletten Signaturweg (tools/sign-file.ps1, Inno-SignTool, Installer-Test)
        # mit einem Test-Zertifikat, damit signierte Releases schon vor der echten Einrichtung getestet sind.
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN="NTB-PW Build-Test"' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable
          $password = [guid]::NewGuid().ToString()
          $pfx = Join-Path $env:RUNNER_TEMP 'test.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          "SIGNING_PFX_BASE64=$([Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx)))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_PFX_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item $pfx

      - name: Anwendung signieren
        shell: powershell
        run: .\tools\sign-file.ps1 -Files '.\publish\NTB-PW PDF-Watcher.exe' -TrustOnThisMachine

      - name: Setup erstellen (Setup und Deinstallation werden dabei signiert)
        shell: powershell
        run: |
          $version = ([xml](Get-Content .\src\NTBPW.PdfWatcher\NTBPW.PdfWatcher.csproj)).Project.PropertyGroup.Version
          .\tools\build-installer.ps1 -Version $version -Sign
          $setup = Get-ChildItem .\dist\NTB-PW-PDF-Watcher-Setup-*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $setup.FullName
          if ($sig.Status -ne 'Valid') { throw "Setup ist nicht gültig signiert: $($sig.Status) $($sig.StatusMessage)" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Installation und Upgrade testen
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem .\dist\NTB-PW-PDF-Watcher-Setup-*.exe | Select-Object -First 1
          .\tools\test-installer.ps1 -NewSetup $setup.FullName -ExpectedVersion $env:APP_VERSION -ExpectSigned
