name: Automatic NTB-PW Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ntb-pw-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Projektversion lesen
        id: version
        shell: powershell
        run: |
          [xml]$project = Get-Content '.\src\NTBPW.PdfWatcher\NTBPW.PdfWatcher.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Keine <Version> in der Projektdatei gefunden.'
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Ermittelte Version: $version"

      - name: Prüfen, ob Release bereits existiert
        id: existing
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG existiert bereits. Kein neuer Release nötig."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG wird erstellt."
          }

      - name: Inno Setup installieren
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Anwendung veröffentlichen
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        run: |
          dotnet publish .\src\NTBPW.PdfWatcher\NTBPW.PdfWatcher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish

      - name: Setup erstellen
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DMyAppVersion=$env:APP_VERSION" `
            '.\installer\NTB-PW-PDF-Watcher.iss'

      - name: SHA-256 erzeugen
        if: steps.existing.outputs.exists != 'true'
        shell: powershell
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = ".\dist\NTB-PW-PDF-Watcher-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $setup)) {
            throw "Setup-Datei nicht gefunden: $setup"
          }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content -Encoding ascii "$setup.sha256"

      - name: GitHub Release veröffentlichen
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NTB-PW PDF-Watcher Professional ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/NTB-PW-PDF-Watcher-Setup-${{ steps.version.outputs.version }}.exe
            dist/NTB-PW-PDF-Watcher-Setup-${{ steps.version.outputs.version }}.exe.sha256
