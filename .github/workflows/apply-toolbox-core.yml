name: Apply toolbox core

on:
  push:
    branches:
      - feature/toolbox-core
    paths:
      - '.github/workflows/apply-toolbox-core.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/toolbox-core

      - name: Toolbox-Seiten integrieren
        shell: powershell
        run: |
          $path = 'src/NTBPW.PdfWatcher/ToolsCenterForm.cs'
          $text = Get-Content $path -Raw
          $text = $text.Replace('internal sealed class ToolsCenterForm : Form', 'internal sealed partial class ToolsCenterForm : Form')
          $needle = 'tabs.TabPages.Add(BuildDiagnosticsPage());'
          if (-not $text.Contains('tabs.TabPages.Add(BuildWindowsPage());')) {
            $replacement = @'
          tabs.TabPages.Add(BuildDiagnosticsPage());
          tabs.TabPages.Add(BuildWindowsPage());
          tabs.TabPages.Add(BuildSystemPage());
          '@
            $text = $text.Replace($needle, $replacement.Trim())
          }
          Set-Content $path $text -Encoding utf8

      - name: Änderungen committen
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NTBPW.PdfWatcher/ToolsCenterForm.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "feat: Windows- und Systemseiten in Toolbox integrieren"
            git push origin feature/toolbox-core
          }
